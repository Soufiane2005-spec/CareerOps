
[project]
name = "careerops-backend"
version = "0.1.0"
description = "Backend API for CareerOps"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "email-validator",
    "argon2-cffi",
    "PyJWT",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[build-system]

requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]