
[project]
name = "careerops-backend"
version = "0.1.0"
description = "Backend API for CareerOps"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "email-validator",
    "argon2-cffi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
